name: Daily scan and publish to GitHub Pages

on:
  schedule:
    # 16:20 IST (10:50 UTC) on weekdays, after NSE's daily candles are final
    - cron: "50 10 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keep the 10-year daily history between runs so each day only fetches the new candles.
      - uses: actions/cache@v4
        with:
          path: data/history
          key: history-${{ github.run_id }}
          restore-keys: |
            history-

      - name: Build universe, update history, run the screen, export the site
        env:
          UPSTOX_REQ_PER_SEC: "3"
        run: |
          python -m app.cli universe
          python -m app.cli history
          python -m app.cli screen
          python -m app.export

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
